name = "runviz-api"
main = "src/index.ts"
compatibility_date = "2026-03-19"

[vars]
FRONTEND_URL = "https://runviz-stats.pages.dev"
FRONTEND_PREVIEW_HOST = "runviz-stats.pages.dev"
# Optional comma-separated allowlist for custom frontend domains.
# Example:
# ADDITIONAL_FRONTEND_URLS = "https://runviz.example.com,https://staging.runviz.example.com"
# ORS_API_KEY must be configured as a Wrangler secret:
# wrangler secret put ORS_API_KEY

[[d1_databases]]
binding = "DB"
database_name = "runviz-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "TOKENS"
id = "30c9eb9422124409935de1f20bb28237"

# For local development, create a preview namespace
# [[kv_namespaces]]
# binding = "TOKENS"
# id = "your-kv-namespace-id"
# preview_id = "your-preview-id"
